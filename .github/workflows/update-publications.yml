name: Update publications JSON

on:
  push:
    paths:
      - 'generate_publications/bibs/**'        # run only when something in bibs/ changes
  workflow_dispatch:      # allow manual runs from the Actions tab

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # or 3.11 / 3.10, as you prefer

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bibtexparser

      - name: Generate JSON from BibTeX
        run: |
          python generate_publications/generate.py generate_publications/bibs \
            -o publications.json \
            -d testduplicates.json
      - name: Commit and push updated JSON to same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add publications.json testduplicates.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update publications JSON from bib changes"

            # Push **back to the same branch** that triggered the workflow
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
