<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferences | ARCOS Research Group</title>

  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <link rel="stylesheet" href="/assets/tailwind/output.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@300;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="scripts/components.js"></script>

</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

  <div id="navbar-container"></div>

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto py-16 px-4 sm:px-6 lg:px-8 text-center">
      <h1 class="font-serif text-3xl md:text-4xl font-bold text-gray-900 mb-4">
        Hosted Conferences & Events
      </h1>
      <p class="max-w-2xl mx-auto text-lg text-gray-500 font-light">
        Key academic meetings and workshops organized or hosted by the ARCOS Research Group.
      </p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <section class="mb-16">
      <h2 class="text-2xl font-serif font-bold text-brand-900 mb-8 flex items-center gap-3">
        <i class="fa-regular fa-calendar-check text-brand-600"></i> Upcoming Events
      </h2>
      <!-- Dynamic Container for Upcoming Conferences -->
      <div id="upcoming-conferences-container" class="grid grid-cols-1 gap-6">
        <!-- Content injected by script -->
      </div>
    </section>

    <section>
      <h2 class="text-xl font-serif font-bold text-gray-700 mb-6 flex items-center gap-3 border-t border-gray-200 pt-8">
        <i class="fa-solid fa-box-archive text-gray-400"></i> Past Events
      </h2>
      <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-6">
        <!-- Dynamic Container for Past Conferences -->
        <div id="past-conferences-container" class="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8">
          <!-- Content injected by script -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <!-- Add the script tag right before the closing body tag -->
  <script src="scripts/conferences.js"></script>
</body>

</html>
